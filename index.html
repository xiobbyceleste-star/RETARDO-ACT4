
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wally Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="cards">

        <!-- FRONT SIDE -->
        <section class="business-card front">

            <div class="corner-circle"></div>

            <p class="business-name">WALLY BUSINESS</p>

            <div class="identity">
                <h1>Jake Wally</h1>
                <p class="role">Business Owner</p>
            </div>

            <div class="divider"></div>

            <div class="contact-list">
                <p>
                    <span>Phone:</span>
                    09XX XXX XXXX
                </p>

                <p>
                    <span>Email:</span>
                    Wallyretardo@email.com
                </p>

                <p>
                    <span>Location:</span>
                    Philippines
                </p>
            </div>

        </section>


        <!-- BACK SIDE -->
        <section class="business-card back">

            <div class="corner-circle"></div>

            <div class="identity">
                <h2>Jake Wally</h2>
                <p class="role">Business Owner</p>
            </div>

            <div class="divider"></div>

            <div class="back-content">

                <!-- Contact Information -->
                <div class="contact-list back-contacts">

                    <p>
                        <span>☎ Phone:</span><br>
                        09XX XXX XXXX
                    </p>

                    <p>
                        <span>✉ Email:</span><br>
                        Wallyretardo@email.com
                    </p>

                </div>

                <!-- QR Code -->
                <div class="qr-box">
                    <img src="qr.png" alt="QR Code">
                    <p>SCAN ME</p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
